notes:
  - Lenovo-issued Hardware Maintenance Manual accessed through a surviving archival mirror because the legacy Lenovo download URL is no longer reliably available.
  - The January 2007 edition explicitly covers machine types 1951, 1952, 1953, 1954, 1955, 1956, 2007, 2008, 2009, 2613, 2623, and 2637 as a combined T60/T60p service family.
  - Specification tables document Intel Core Solo/Core Duo/Core 2 Duo processors, 667 MHz DDR2, Intel GMA 950, ATI Mobility Radeon X1300/X1400 and ATI FireGL V5200 graphics, 14.1-inch and 15.0-inch displays, SATA storage, Ultrabay Slim, and a 4 GB physical memory maximum.
  - Because the HMM groups T60 and T60p together, machine types are preserved as a combined source scope rather than guessed into individual canonical records.
