notes:
  - Family coverage remains partial; this index lists only canonical model records currently present in the repository.
  - Standard, slim/s, performance/p, workstation, and ultrabook/u variants remain separate canonical models when IBM/Lenovo documents distinct product identities and configurations.
  - T40 and T40p are separate canonical identities because IBM/Lenovo support material distinguishes a workstation-oriented sibling with FireGL/SXGA+ configurations.
  - T41/T41p, T42/T42p, T43/T43p, T60/T60p, and T61/T61p retain separate identities while combined HMMs leave some MTM splits unresolved.
  - T410i/T410si, T420i/T420si, and T430i/T430si are retained as aliases/configuration tiers until stronger primary evidence establishes separate physical identities.
