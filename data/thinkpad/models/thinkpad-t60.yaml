form_factor:
  class: laptop
  chassis: 14.1-inch and 15.0-inch standard-aspect clamshell; later 15.4-inch widescreen variants also existed in the T60 generation
  dimensions_mm: null
  starting_weight_kg: null
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008
