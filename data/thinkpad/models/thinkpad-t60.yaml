    - The shared HMM also lists ATI FireGL graphics used by workstation configurations; those are represented on T60p rather than asserted for ordinary T60 configurations.

memory:
  technology: DDR2-667 PC2-5300 SO-DIMM; selected DDR2-533 modules supported
  slots: 2
  soldered: false
  official_max_gb: 4
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008
  notes:
    - Lenovo states 4 GB is physically installable but only about 3 GB is usable under the documented 32-bit PC architecture.

storage:
  interfaces:
    - 2.5-inch SATA hard disk drive
  bays:
    - 1x primary 2.5-inch SATA storage bay
    - 1x Ultrabay Slim removable-device bay
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008

display:
  options:
    - size_in: 14.1
      resolution: 1024x768
      panel: XGA TFT
    - size_in: 14.1
      resolution: 1400x1050
      panel: SXGA+ TFT
    - size_in: 15.0
      resolution: 1024x768
      panel: XGA TFT
    - size_in: 15.0
      resolution: 1400x1050
      panel: SXGA+ IPS TFT on supported configurations
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008
  notes:
    - The shared service family also includes 1600x1200 IPS panels associated with high-end configurations; exact T60/T60p MTM mapping remains open.

networking:
  ethernet:
    - wired Ethernet, configuration-dependent controller
  wlan:
    - PCI Express Mini Card wireless LAN options
  wwan:
    - integrated WWAN on selected regional/configuration variants
  bluetooth:
    - Bluetooth on selected configurations
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008
