    - Chassis-specific dimensions and weights remain to be normalized from primary product sheets.

platform:
  chipset: Intel 945 mobile-platform family, configuration-dependent
  cpu_options:
    - Intel Core Solo T1300/T1400
    - Intel Core Duo T2300/T2300E/T2400/T2500/T2600/T2700
    - Intel Core 2 Duo T5500/T5600/T7200/T7400/T7600
  gpu_options:
    - Intel Graphics Media Accelerator 950
    - ATI Mobility Radeon X1300
    - ATI Mobility Radeon X1400
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008
