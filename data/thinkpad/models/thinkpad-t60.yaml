ports:
  - USB 2.0
  - VGA
  - RJ-45 Ethernet
  - modem/RJ-11 on selected configurations
  - audio jacks
  - docking connector
  - PC Card/ExpressCard expansion depending configuration

expansion:
  - Ultrabay Slim
  - PCI Express Mini Card WLAN/WWAN expansion
  - docking/port-replicator support
  - optional fingerprint reader

power:
  adapters:
    - 20 V Lenovo barrel-jack AC adapters, configuration-dependent
  batteries:
    - removable lithium-ion battery pack
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008

software:
  operating_systems:
    - Windows XP editions on original configurations
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008

serviceability:
  replaceable_components:
    - two SO-DIMM memory modules
    - removable CPU
    - primary SATA storage device
    - Ultrabay Slim device
    - removable battery
    - WLAN/WWAN cards
    - display assembly
  upgrade_notes:
    - Lenovo service documentation exposes CPU, DIMMs, storage, Ultrabay device, wireless cards, battery, keyboard, palm rest, and display as separately replaceable assemblies.
  limitations:
    - Per-model machine-type mapping remains unresolved because the principal Lenovo HMM combines T60 and T60p identities.
    - Display, graphics, wireless, battery, and adapter combinations vary substantially by MTM and region.
  source_ids:
    - lenovo-hmm-thinkpad-t60-t60p-14-15-2008

sources:
  - lenovo-hmm-thinkpad-t60-t60p-14-15-2008
